<!DOCTYPE html>
<html lang="">

<head>
    <title>lightweight-charts-python</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <script>
        // Global error suppression for known transient chart errors
        const suppressErrors = (msg) => {
            const msgs = [
                "Cannot read properties of undefined (reading 'series')",
                "Cannot read properties of undefined (reading 'updatePoints')",
                "Cannot read properties of null (reading 'style')",
                "Value is null"
            ];
            if (msg && msgs.some(m => msg.includes(m))) {
                return true;
            }
            return false;
        };

        window.addEventListener('error', function (event) {
            if (suppressErrors(event.message)) {
                event.stopImmediatePropagation();
                event.preventDefault();
                return;
            }
            console.log(`Global Error Caught: ${event.message} at ${event.filename}:${event.lineno}`);
        }, true);

        window.onerror = function (msg, url, lineNo, columnNo, error) {
            if (suppressErrors(msg)) {
                return true;
            }
            console.log(`Window Error: ${msg} at ${url}:${lineNo}`);
            return false;
        };
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #ffffff;
            /* Ensure background matches chart */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
                Cantarell, "Helvetica Neue", sans-serif;
        }

        #container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>

    <script>window.TOOLBOX_ORDER = ["trend","horz","ray","box","vert","text","arrow_up","arrow_down","trash"];</script>
    <script src="./bundle.js"></script>
